<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Downtown Events Announcement Widget</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; background: transparent; }
  #announcements {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    padding: 8px;
  }
  .announcement-card {
    width: 220px;
    text-align: center;
  }
  .announcement-card img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
  }
  .announcement-card .caption {
    margin-top: 8px;
    font-size: 14px;
    color: #333;
  }
  a.announcement-link { text-decoration:none; color: inherit; }
  #status-message { text-align:center; padding: 8px; font-family: Arial, sans-serif; }
</style>
</head>
<body>
  <div id="status-message">Loading announcements…</div>
  <div id="announcements"></div>

  <script>
    // CONFIG
    const SHEET_JSON_URL = "https://opensheet.elk.sh/1Nfpy-vFPQn5wFcdvDlQpM5cXjfY4uYvzFx0COrc0PAc/Form Responses 1";

    // IMPORTANT: these must match your Google Sheet header row EXACTLY
    const FIELD_IMAGE = "Upload Image";
    const FIELD_LINK = "Link URL";
    const FIELD_CAPTION = "Caption";     // optional column; safe if it doesn't exist
    const FIELD_SHOW = "Show";           // optional column; add "Yes"/"No" per row to control visibility

    function extractDriveFileId(url) {
      if (!url) return null;
      const match = url.match(/[-\w]{25,}/);
      return match ? match[0] : null;
    }

    function driveImageUrl(driveLink) {
      const id = extractDriveFileId(driveLink);
      // Google Drive blocks the old "uc?export=view" format from being embedded
      // in <img> tags (OpaqueResponseBlocking). The "thumbnail" endpoint works instead.
      return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : "";
    }

    // A row is shown unless its Show column is explicitly "no", "false", "0", or "hide"
    function isVisible(row) {
      const val = (row[FIELD_SHOW] || "").toString().trim().toLowerCase();
      if (val === "") return true; // no Show column filled in yet -> default to visible
      return !["no", "false", "0", "hide", "n"].includes(val);
    }

    async function loadAnnouncements() {
      const statusEl = document.getElementById("status-message");
      const gridEl = document.getElementById("announcements");

      try {
        const res = await fetch(SHEET_JSON_URL);
        if (!res.ok) throw new Error("Sheet fetch failed: " + res.status);
        const rows = await res.json();

        if (!Array.isArray(rows) || rows.length === 0) {
          statusEl.innerText = "No announcements yet.";
          return;
        }

        // Most recent first, only rows with an image and Show !== "No"
        const visibleRows = rows
          .filter(r => r[FIELD_IMAGE] && isVisible(r))
          .reverse();

        if (visibleRows.length === 0) {
          statusEl.innerText = "No announcements right now.";
          return;
        }

        statusEl.style.display = "none";

        gridEl.innerHTML = visibleRows.map(row => {
          const linkUrl = row[FIELD_LINK] || "#";
          const caption = row[FIELD_CAPTION] || "";
          const imgSrc = driveImageUrl(row[FIELD_IMAGE]);

          if (!imgSrc) return "";

          return `
            <div class="announcement-card">
              <a class="announcement-link" href="${linkUrl}" target="_blank" rel="noopener">
                <img src="${imgSrc}" alt="${caption}" referrerpolicy="no-referrer"
                     onerror="this.closest('.announcement-card').innerHTML = '<p>Could not load image.</p>';">
                ${caption ? `<div class="caption">${caption}</div>` : ""}
              </a>
            </div>
          `;
        }).join("");

      } catch (err) {
        statusEl.innerText = "Could not load announcements.";
        console.error(err);
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>
