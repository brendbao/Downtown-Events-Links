<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Downtown Events Announcement Widget</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; background: transparent; }
  #announcement { text-align:center; padding: 8px; }
  #announcement img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
  }
  #caption { margin-top: 8px; font-size: 14px; color: #333; }
  a.announcement-link { text-decoration:none; }
</style>
</head>
<body>
  <div id="announcement">Loading announcement…</div>

  <script>
    // CONFIG
    const SHEET_JSON_URL = "https://opensheet.elk.sh/1Nfpy-vFPQn5wFcdvDlQpM5cXjfY4uYvzFx0COrc0PAc/Form Responses 1";

    // IMPORTANT: these must match your Google Sheet header row EXACTLY
    const FIELD_IMAGE = "Upload Image";
    const FIELD_LINK = "Link URL";
    const FIELD_CAPTION = "Caption"; // optional column; safe if it doesn't exist

    function extractDriveFileId(url) {
      if (!url) return null;
      const match = url.match(/[-\w]{25,}/);
      return match ? match[0] : null;
    }

    function driveImageUrl(driveLink) {
      const id = extractDriveFileId(driveLink);
      return id ? `https://drive.google.com/uc?export=view&id=${id}` : "";
    }

    async function loadAnnouncement() {
      const container = document.getElementById("announcement");
      try {
        const res = await fetch(SHEET_JSON_URL);
        if (!res.ok) throw new Error("Sheet fetch failed: " + res.status);
        const rows = await res.json();

        if (!Array.isArray(rows) || rows.length === 0) {
          container.innerText = "No announcements yet.";
          return;
        }

        // Find the most recent row that actually has an image value
        let latest = null;
        for (let i = rows.length - 1; i >= 0; i--) {
          if (rows[i][FIELD_IMAGE]) {
            latest = rows[i];
            break;
          }
        }

        if (!latest) {
          container.innerText = "No announcements yet.";
          return;
        }

        const imageCell = latest[FIELD_IMAGE];
        const linkUrl   = latest[FIELD_LINK] || "#";
        const caption   = latest[FIELD_CAPTION] || "";

        const imgSrc = driveImageUrl(imageCell);

        if (!imgSrc) {
          container.innerText = "Could not read image from latest submission. Check field names in index.html.";
          console.warn("Latest row:", latest);
          return;
        }

        container.innerHTML = `
          <a class="announcement-link" href="${linkUrl}" target="_blank" rel="noopener">
            <img src="${imgSrc}" alt="${caption}">
          </a>
          ${caption ? `<div id="caption">${caption}</div>` : ""}
        `;
      } catch (err) {
        container.innerText = "Could not load announcement.";
        console.error(err);
      }
    }

    loadAnnouncement();
  </script>
</body>
</html>
