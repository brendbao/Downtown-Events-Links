<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Downtown Events Announcement Widget</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; background: transparent; color:#1a1a1a; }

  /* Calendar */
  #calendar-wrap { max-width: 900px; margin: 0 auto 32px; padding: 8px; }
  #calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  #calendar-header button {
    background: #1c75bc;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 16px;
    cursor: pointer;
  }
  #calendar-header button:hover { background: #15619e; }
  #calendar-title { font-size: 20px; font-weight: bold; color: #1c75bc; }
  #calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-daylabel {
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    color: #1c75bc;
    padding: 4px 0;
  }
  .cal-day {
    min-height: 84px;
    border: 1px solid #e3edf5;
    border-radius: 6px;
    padding: 4px;
    font-size: 12px;
    position: relative;
    cursor: default;
    overflow: hidden;
  }
  .cal-day.empty { border: none; }
  .cal-day .cal-daynum { font-size: 12px; color: #555; font-weight: bold; }
  .cal-day.has-event { cursor: pointer; background: #eaf3fb; border-color: #1c75bc; }
  .cal-day.has-event:hover { background: #d9ebf8; }
  .cal-event-name {
    display: block;
    background: #f5a623;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    border-radius: 4px;
    padding: 2px 4px;
    margin-top: 3px;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Announcement cards */
  #announcements {
    display: flex;
    flex-direction: column;
    gap: 32px;
    align-items: center;
    padding: 8px;
  }
  .announcement-card {
    width: 100%;
    max-width: 1200px;
    text-align: center;
    transition: box-shadow 0.3s ease;
    border-radius: 12px;
    scroll-margin-top: 16px;
  }
  .announcement-card.highlight {
    box-shadow: 0 0 0 4px #f5a623;
  }
  .announcement-card img {
    width: 100%;
    height: auto;
    border-radius: 12px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  }
  .announcement-card .caption {
    margin-top: 10px;
    font-size: 18px;
    color: #1c75bc;
    font-weight: bold;
  }
  a.announcement-link { text-decoration:none; color: inherit; }
  #status-message { text-align:center; padding: 8px; font-family: Arial, sans-serif; }
</style>
</head>
<body>

  <div id="calendar-wrap">
    <div id="calendar-header">
      <button id="cal-prev">&#8592; Prev</button>
      <div id="calendar-title"></div>
      <button id="cal-next">Next &#8594;</button>
    </div>
    <div id="calendar-grid"></div>
  </div>

  <div id="status-message">Loading announcements…</div>
  <div id="announcements"></div>

  <script>
    // CONFIG
    const SHEET_JSON_URL = "https://opensheet.elk.sh/1Nfpy-vFPQn5wFcdvDlQpM5cXjfY4uYvzFx0COrc0PAc/Form Responses 1";

    // IMPORTANT: these must match your Google Sheet header row EXACTLY
    const FIELD_IMAGE = "Upload Image";
    const FIELD_LINK = "Link URL";
    const FIELD_CAPTION = "Caption";       // optional column; safe if it doesn't exist
    const FIELD_SHOW = "Show";             // optional column; add "Yes"/"No" per row to control visibility
    const FIELD_EVENT_DATE = "Event Date"; // optional column; used to power the calendar
    const FIELD_EVENT_NAME = "Event Name"; // optional column; short label shown on the calendar day

    function extractDriveFileId(url) {
      if (!url) return null;
      const match = url.match(/[-\w]{25,}/);
      return match ? match[0] : null;
    }

    function driveImageUrl(driveLink) {
      const id = extractDriveFileId(driveLink);
      // Google Drive blocks the old "uc?export=view" format from being embedded
      // in <img> tags (OpaqueResponseBlocking). The "thumbnail" endpoint works instead.
      // sz=w2000 requests a high-res version so it stays sharp at full width.
      return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w2000` : "";
    }

    // A row is shown unless its Show column is explicitly "no", "false", "0", or "hide"
    function isVisible(row) {
      const val = (row[FIELD_SHOW] || "").toString().trim().toLowerCase();
      if (val === "") return true; // no Show column filled in yet -> default to visible
      return !["no", "false", "0", "hide", "n"].includes(val);
    }

    // Parse a variety of date formats (MM/DD/YYYY, YYYY-MM-DD, etc.) into a Date object (local, no time)
    function parseEventDate(value) {
      if (!value) return null;
      const str = value.toString().trim();
      if (!str) return null;

      // Try native parsing first
      let d = new Date(str);
      if (!isNaN(d.getTime())) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
      }

      // Try MM/DD/YYYY manually as fallback
      const parts = str.split(/[\/\-]/);
      if (parts.length === 3) {
        let [a, b, c] = parts.map(p => parseInt(p, 10));
        if (c < 100) c += 2000;
        // assume MM/DD/YYYY
        d = new Date(c, a - 1, b);
        if (!isNaN(d.getTime())) return d;
      }
      return null;
    }

    function dateKey(d) {
      return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
    }

    function escapeHtml(str) {
      return (str || "").toString()
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    let allRows = [];
    let calendarDate = new Date(); // current month being viewed
    calendarDate.setDate(1);

    function renderCalendar() {
      const grid = document.getElementById("calendar-grid");
      const title = document.getElementById("calendar-title");

      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      title.innerText = monthNames[month] + " " + year;

      // Build a map of dateKey -> [rows]
      const eventsByDay = {};
      allRows.forEach(row => {
        const d = parseEventDate(row[FIELD_EVENT_DATE]);
        if (!d) return;
        const key = dateKey(d);
        if (!eventsByDay[key]) eventsByDay[key] = [];
        eventsByDay[key].push(row);
      });

      const firstDay = new Date(year, month, 1);
      const startWeekday = firstDay.getDay(); // 0 = Sun
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = "";
      ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d => {
        html += `<div class="cal-daylabel">${d}</div>`;
      });

      for (let i = 0; i < startWeekday; i++) {
        html += `<div class="cal-day empty"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const key = dateKey(new Date(year, month, day));
        const dayEvents = eventsByDay[key] || [];
        const hasEvent = dayEvents.length > 0;

        const namesHtml = dayEvents.map(row => {
          const name = row[FIELD_EVENT_NAME] || row[FIELD_CAPTION] || "Event";
          return `<span class="cal-event-name" title="${escapeHtml(name)}">${escapeHtml(name)}</span>`;
        }).join("");

        html += `
          <div class="cal-day${hasEvent ? " has-event" : ""}" ${hasEvent ? `data-key="${key}"` : ""}>
            <div class="cal-daynum">${day}</div>
            ${namesHtml}
          </div>
        `;
      }

      grid.innerHTML = html;

      // Wire up click-to-scroll on days with events
      grid.querySelectorAll(".cal-day.has-event").forEach(el => {
        el.addEventListener("click", () => {
          const key = el.getAttribute("data-key");
          const target = document.querySelector(`.announcement-card[data-datekey="${key}"]`);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "center" });
            target.classList.add("highlight");
            setTimeout(() => target.classList.remove("highlight"), 2000);
          }
        });
      });
    }

    document.getElementById("cal-prev").addEventListener("click", () => {
      calendarDate.setMonth(calendarDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById("cal-next").addEventListener("click", () => {
      calendarDate.setMonth(calendarDate.getMonth() + 1);
      renderCalendar();
    });

    const FIELD_CAPTION_FALLBACK = FIELD_CAPTION; // kept for clarity in renderCalendar

    async function loadAnnouncements() {
      const statusEl = document.getElementById("status-message");
      const gridEl = document.getElementById("announcements");

      try {
        const res = await fetch(SHEET_JSON_URL);
        if (!res.ok) throw new Error("Sheet fetch failed: " + res.status);
        const rows = await res.json();

        if (!Array.isArray(rows) || rows.length === 0) {
          statusEl.innerText = "No announcements yet.";
          return;
        }

        allRows = rows.filter(r => r[FIELD_IMAGE] && isVisible(r));
        renderCalendar();

        // Most recent first
        const visibleRows = allRows.slice().reverse();

        if (visibleRows.length === 0) {
          statusEl.innerText = "No announcements right now.";
          return;
        }

        statusEl.style.display = "none";

        gridEl.innerHTML = visibleRows.map(row => {
          const linkUrl = row[FIELD_LINK] || "#";
          const caption = row[FIELD_CAPTION] || "";
          const imgSrc = driveImageUrl(row[FIELD_IMAGE]);
          const eventDate = parseEventDate(row[FIELD_EVENT_DATE]);
          const key = eventDate ? dateKey(eventDate) : "";

          if (!imgSrc) return "";

          return `
            <div class="announcement-card" data-datekey="${key}">
              <a class="announcement-link" href="${linkUrl}" target="_blank" rel="noopener">
                <img src="${imgSrc}" alt="${caption}" referrerpolicy="no-referrer"
                     onerror="this.closest('.announcement-card').innerHTML = '<p>Could not load image.</p>';">
                ${caption ? `<div class="caption">${caption}</div>` : ""}
              </a>
            </div>
          `;
        }).join("");

      } catch (err) {
        statusEl.innerText = "Could not load announcements.";
        console.error(err);
      }
    }

    loadAnnouncements();
  </script>
</body>
</html>
